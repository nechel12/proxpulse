name: Bug report
description: Report a reproducible bug
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove working proxies, proxy credentials,
        webhook URLs, API keys and other personal data before posting.

  - type: input
    id: version
    attributes:
      label: ProxPulse version
      description: Shown on the Info tab.
      placeholder: "e.g. 0.4.4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - NSIS installer (-setup.exe)
        - MSI
        - Portable .exe
        - AppImage
        - .deb / .rpm
        - .dmg
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Check
        - Dispatcher
        - Scheduled checks / webhooks
        - Import / export
        - Updates / tray
        - Other
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps and settings (check server, preset, proxy type). Replace real proxies with placeholders.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Info tab → Diagnostics → Copy. Check it for secrets first.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed working proxies, credentials, webhook URLs and keys.
          required: true
        - label: I checked the README and existing issues.
          required: true
