name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # Before tagging: bump version in package.json,
      # src-tauri/tauri.conf.json and src-tauri/Cargo.toml to match.
      # Signing key lives in repo secrets as TAURI_SIGNING_PRIVATE_KEY.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ProxPulse ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false

      # Portable exe is not a Tauri bundle target — upload the raw binary.
      # Runs after tauri-action created the release above.
      - name: Upload portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/proxpulse.exe "ProxPulse_${{ github.ref_name }}_portable.exe"
          gh release upload "${{ github.ref_name }}" "ProxPulse_${{ github.ref_name }}_portable.exe" --clobber
