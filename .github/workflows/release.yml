name: release

on:
  push:
    tags:
      - "v*"

# The updater signing key reaches only the `sign` job, which runs no
# dependency code; the platform jobs build without it.
# Write access is granted per job: `verify` installs and runs third-party npm
# and cargo code, so it only gets a read-only token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release is a tag on main signed with the docs/proxpulse-release.pub key.
  # Checked first: nothing else runs for a tag that fails this.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the check needs origin/main
          persist-credentials: false
      - name: Verify release tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag does not point to a commit on main"
            exit 1
          fi
          # checkout may leave a lightweight ref on the tag: take the annotated object
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          printf 'proxpulse-release namespaces="git" %s\n' \
            "$(cut -d' ' -f1,2 docs/proxpulse-release.pub)" > "$RUNNER_TEMP/allowed_signers"
          if ! git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$tag"; then
            echo "::error::$tag is not signed with the release key"
            exit 1
          fi

  # A tag may only be published after the same checks CI runs on main.
  verify:
    needs: tag
    runs-on: ubuntu-22.04
    # 0.6.1 took 28 minutes of 30.
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          # Read main's cache; a tag's own (about 1 GB) would never be read.
          save-if: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run check:versions
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      # cargo-audit directly, as in audit.yml: rustsec/audit-check reports
      # warnings through the Checks API, which this job's read-only token
      # cannot write. Vulnerabilities fail the release; warnings (unmaintained,
      # yanked) are printed.
      - name: RustSec audit
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock

  # The release is created as a draft and published only by `notes`, after
  # every platform is uploaded. A draft is invisible to the updater
  # (releases/latest skips drafts), so users never get a partial latest.json,
  # and a failed platform leaves an unpublished draft instead of a release
  # that misses it.
  draft:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          found="$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0] // empty | \"\(.id) \(.draft)\"")"
          if [ -z "$found" ]; then
            # The id comes from the create call itself: the release list may
            # not show a new draft yet.
            id="$(gh api -X POST "repos/$GH_REPO/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="ProxPulse $GITHUB_REF_NAME" \
              -f body="See the assets below to download and install this version." \
              -F draft=true --jq .id)"
          else
            read -r id draft <<< "$found"
            # A re-run reuses its own draft but never touches a published release.
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published"
              exit 1
            fi
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not 24.04): older glibc → runs on more distros.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # macos-latest runners are ARM64. The Intel build is unsigned
          # and untested (no Mac, see README).
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      # The token is used through the API (tauri-action, gh), never by git,
      # so it is not left in .git/config for build scripts to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci

      # Before tagging: bump version in package.json,
      # src-tauri/tauri.conf.json and src-tauri/Cargo.toml to match.
      # Built WITHOUT the updater signing key: this job runs npm's and every
      # crate's build scripts, and code from a dependency must never see the
      # key. The `sign` job signs the updater artifacts and writes latest.json.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: ${{ matrix.args }} --config src-tauri/tauri.unsigned.conf.json
          includeUpdaterJson: false

      # The macOS updater takes the app as a .tar.gz, which the bundler makes
      # only when it signs. COPYFILE_DISABLE keeps macOS metadata files out.
      - name: Pack the macOS app for the updater
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          name="ProxPulse_${GITHUB_REF_NAME#v}_${ARCH}.app.tar.gz"
          tar -czf "$name" -C "src-tauri/target/$TARGET/release/bundle/macos" ProxPulse.app
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber

      # Portable exe is not a Tauri bundle target — upload the raw binary.
      # Windows-only (Linux already ships portable AppImage,
      # macOS ships .app.tar.gz). gh finds the draft by its tag.
      - name: Upload portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Named like the other Windows assets: version without "v", then arch.
        run: |
          NAME="ProxPulse_${GITHUB_REF_NAME#v}_x64-portable.exe"
          cp src-tauri/target/release/proxpulse.exe "$NAME"
          gh release upload "$GITHUB_REF_NAME" "$NAME" --clobber

  # Signs the updater artifacts and writes latest.json. The signing key is
  # only in the "Sign" step, which runs nothing but the Tauri CLI pinned by
  # package-lock.json, installed without install scripts: no dependency's code
  # runs while the key is in the environment.
  sign:
    needs: [draft, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install the Tauri CLI (no install scripts)
        run: npm ci --ignore-scripts

      - name: Download the updater artifacts
        env:
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets" > "$RUNNER_TEMP/assets.json"
          mkdir updater
          node scripts/updater-manifest.mjs --artifacts "$RUNNER_TEMP/assets.json" > "$RUNNER_TEMP/artifacts.txt"
          while IFS= read -r name; do
            gh release download "$GITHUB_REF_NAME" --dir updater --pattern "$name"
          done < "$RUNNER_TEMP/artifacts.txt"

      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for f in updater/*; do
            # The version goes into the signed comment, as `tauri build` does.
            ./node_modules/.bin/tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "$f"
          done

      - name: Upload the signatures and latest.json
        run: |
          set -euo pipefail
          node scripts/updater-manifest.mjs "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/assets.json" updater \
            "https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME" > latest.json
          gh release upload "$GITHUB_REF_NAME" updater/*.sig latest.json --clobber

  # Replaces the placeholder body with the changelog section and an exact
  # file → platform map (filenames contain the version, so it is generated).
  # Runs after every platform job (tauri-action must not overwrite after).
  notes:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Checksums for manual downloads (the updater verifies its own
      # signatures). Every platform job has uploaded its files by now.
      - name: Publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --dir assets
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber

      - name: Write the release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

      # Publish only a manifest that has every platform: a platform job that
      # uploaded no updater artifact would leave its users without updates.
      - name: Check the updater manifest
        run: |
          jq -e '.platforms | has("windows-x86_64") and has("linux-x86_64")
            and has("darwin-aarch64") and has("darwin-x86_64")' assets/latest.json

      # Last step: only now does the release, and its latest.json, reach users.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
