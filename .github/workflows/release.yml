name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag may only be published after the same checks CI runs on main.
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run check:versions
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  release:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not 24.04): older glibc → runs on more distros.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # macos-latest runners are ARM64. The Intel build is unsigned
          # and untested (no Mac, see README).
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci

      # Before tagging: bump version in package.json,
      # src-tauri/tauri.conf.json and src-tauri/Cargo.toml to match.
      # Signing key lives in repo secrets as TAURI_SIGNING_PRIVATE_KEY
      # (one minisign key signs every platform).
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ProxPulse ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # README recommends the NSIS installer; keep latest.json in sync.
          updaterJsonPreferNsis: true

      # Portable exe is not a Tauri bundle target — upload the raw binary.
      # Windows-only (Linux already ships portable AppImage,
      # macOS ships .app.tar.gz). Runs after tauri-action created the release.
      - name: Upload portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/proxpulse.exe "ProxPulse_${{ github.ref_name }}_portable.exe"
          gh release upload "${{ github.ref_name }}" "ProxPulse_${{ github.ref_name }}_portable.exe" --clobber

  # Replaces the placeholder body with an exact file → platform map
  # (filenames contain the version, so it is generated here, not static).
  # Runs after every platform job (tauri-action must not overwrite after).
  notes:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gh resolves the repo via git, so checkout is required even though
      # no files are used.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          TAG="$GITHUB_REF_NAME"
          gh release edit "$TAG" --notes "## What to download

          **Windows (x64)**
          - \`ProxPulse_${VER}_x64-setup.exe\` — NSIS installer (recommended, auto-updates)
          - \`ProxPulse_${VER}_x64_en-US.msi\` — MSI installer (manual updates)
          - \`ProxPulse_${TAG}_portable.exe\` — portable, no install (manual updates)

          **Linux (x64)**
          - \`ProxPulse_${VER}_amd64.AppImage\` — portable (auto-updates)
          - \`ProxPulse_${VER}_amd64.deb\` — Debian/Ubuntu package (update via apt/dpkg)
          - \`ProxPulse-${VER}-1.x86_64.rpm\` — Fedora/openSUSE package (update via rpm/dnf)

          **macOS (Apple Silicon)** — unsigned, see README for Gatekeeper steps
          - \`ProxPulse_${VER}_aarch64.dmg\`

          **macOS (Intel)** — unsigned and untested
          - \`ProxPulse_${VER}_x64.dmg\`

          Linux auto-update is AppImage-only. \`latest.json\` and \`.sig\` files
          are for the built-in updater; you do not need to download them."
