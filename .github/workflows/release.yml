name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not 24.04): older glibc → runs on more distros.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # macos-latest runners are ARM64. The Intel build is unsigned
          # and untested (no Mac, see README).
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci

      # Before tagging: bump version in package.json,
      # src-tauri/tauri.conf.json and src-tauri/Cargo.toml to match.
      # Signing key lives in repo secrets as TAURI_SIGNING_PRIVATE_KEY
      # (one minisign key signs every platform).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ProxPulse ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Portable exe is not a Tauri bundle target — upload the raw binary.
      # Windows-only (Linux already ships portable AppImage,
      # macOS ships .app.tar.gz). Runs after tauri-action created the release.
      - name: Upload portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/proxpulse.exe "ProxPulse_${{ github.ref_name }}_portable.exe"
          gh release upload "${{ github.ref_name }}" "ProxPulse_${{ github.ref_name }}_portable.exe" --clobber

  # Replaces the placeholder body with an exact file → platform map
  # (filenames contain the version, so it is generated here, not static).
  # Runs after every platform job (tauri-action must not overwrite after).
  notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          TAG="$GITHUB_REF_NAME"
          gh release edit "$TAG" --notes "## What to download

          **Windows (x64)**
          - \`ProxPulse_${VER}_x64-setup.exe\` — installer (recommended, auto-updates)
          - \`ProxPulse_${VER}_x64_en-US.msi\` — MSI installer (auto-updates)
          - \`ProxPulse_${TAG}_portable.exe\` — portable, no install (update manually)

          **Linux (x64)**
          - \`ProxPulse_${VER}_amd64.AppImage\` — portable (update manually)
          - \`ProxPulse_${VER}_amd64.deb\` — Debian/Ubuntu (auto-updates)
          - \`ProxPulse-${VER}-1.x86_64.rpm\` — Fedora/openSUSE (auto-updates)

          **macOS (Apple Silicon)** — unsigned, see README for Gatekeeper steps
          - \`ProxPulse_${VER}_aarch64.dmg\`

          **macOS (Intel)** — unsigned and untested
          - \`ProxPulse_${VER}_x86_64.dmg\`

          \`latest.json\` and \`.sig\` files are for the built-in updater, you do not need to download them."
